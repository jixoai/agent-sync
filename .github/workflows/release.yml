name: release

# 触发：推 v* 标签（正式发布），或手动运行（可 dry_run 只构建不发）。
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "版本号（不带 v；手动触发时必填，否则用标签）"
        required: false
      dry_run:
        description: "只构建不发布"
        type: boolean
        default: false

permissions:
  contents: write # 创建 GitHub Release
  id-token: write # npm trusted publishing（OIDC），不需要 NPM_TOKEN

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  publish:
    # 自托管 runner（Apple Silicon Mac）：发布物与构建机同架构，省掉交叉编译。
    runs-on: [self-hosted, macOS, ARM64]
    environment: npm-publish

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 解析版本
        id: v
        run: |
          if [ -n "${{ inputs.version }}" ]; then
            V="${{ inputs.version }}"
          else
            V="${GITHUB_REF_NAME#v}"
          fi
          case "$V" in
            ""|*[!0-9.]*) echo "版本号非法：$V"; exit 1 ;;
          esac
          echo "version=$V" >> "$GITHUB_OUTPUT"
          echo "发布版本：$V"

      - name: 工具链
        run: |
          # Node 22 + npm 11 是本机为 trusted publishing 准备的（npm <11.5 不支持 OIDC 发布）。
          for p in "$HOME/tools/node-v22/bin" "$HOME/.cargo/bin" "$HOME/.nsh/bin" "$HOME/.local/bin" /opt/homebrew/bin; do
            [ -d "$p" ] && echo "$p" >> "$GITHUB_PATH"
          done
          echo "--- 工具版本 ---"
          node -v
          npm -v
          cargo -V
          nsh --version

      - name: 构建并打包菜单栏应用
        working-directory: app
        run: |
          nsh build
          nsh package --target macos

      - name: 打包待嵌入的 app
        run: |
          mkdir -p dist
          tar -czf dist/AgentsSync.app.tar.gz -C app/.nsh/out AgentsSync.app
          ls -lh dist/AgentsSync.app.tar.gz

      - name: 构建 CLI（嵌入 app）
        env:
          AGENTS_SYNC_APP_TARBALL: ${{ github.workspace }}/dist/AgentsSync.app.tar.gz
        run: cargo build --release -p agents-sync

      - name: 组装发布产物
        env:
          V: ${{ steps.v.outputs.version }}
        run: |
          set -euo pipefail
          # GitHub Release 资产：单平台压缩包 + 校验和
          rm -rf dist-npm dist/rel && mkdir -p dist/rel dist-npm
          cp target/release/agents-sync dist/rel/agents-sync
          chmod 755 dist/rel/agents-sync
          tar -czf "dist/rel/agents-sync-v$V-darwin-arm64.tar.gz" -C dist/rel agents-sync
          ( cd dist/rel && shasum -a 256 ./*.tar.gz > SHA256SUMS.txt && rm agents-sync )
          cat dist/rel/SHA256SUMS.txt

          # npm 包：只有 JS 启动器（几 KB），二进制走 GitHub Release
          cp -R npm/bin npm/lib npm/README.md dist-npm/
          node -e '
            const fs = require("fs");
            const p = JSON.parse(fs.readFileSync("npm/package.json", "utf8"));
            p.version = process.env.V;
            fs.writeFileSync("dist-npm/package.json", JSON.stringify(p, null, 2) + "\n");
          '
          echo "--- npm 包内容 ---"
          find dist-npm -type f | sort
          du -sh dist-npm

      - name: 冒烟测试
        env:
          V: ${{ steps.v.outputs.version }}
        run: |
          set -euo pipefail
          TMP=$(mktemp -d)
          tar -xzf "dist/rel/agents-sync-v$V-darwin-arm64.tar.gz" -C "$TMP"
          test "$("$TMP/agents-sync" --version)" = "agents-sync $V"
          HOME="$TMP/home" AGENTS_SYNC_NO_LAUNCHD=1 "$TMP/agents-sync" install
          test -x "$TMP/home/Applications/AgentsSync.app/Contents/MacOS/AgentsSync"
          test -f "$TMP/home/.local/bin/agents-sync"
          rm -rf "$TMP"
          node --check dist-npm/lib/run.js
          node --check dist-npm/lib/download.js
          node --check dist-npm/lib/mirror.js

      - name: GitHub Release（资产先就位，启动器才能下载）
        if: ${{ !inputs.dry_run }}
        env:
          GH_TOKEN: ${{ github.token }}
          V: ${{ steps.v.outputs.version }}
        run: |
          set -euo pipefail
          if gh release view "v$V" >/dev/null 2>&1; then
            gh release upload "v$V" dist/rel/* --clobber
          else
            gh release create "v$V" dist/rel/* --target main --title "v$V" --generate-notes
          fi

      - name: 发布到 npm
        if: ${{ !inputs.dry_run }}
        working-directory: dist-npm
        env:
          # 自托管 runner 的用户级 ~/.npmrc 里可能有本机代理（实测指到已关闭的端口，
          # 上传阶段 ECONNREFUSED）。发布用独立配置：直连 registry。
          NPM_CONFIG_USERCONFIG: ${{ runner.temp }}/npmrc-release
          # 可选：仅在需要临时用 token 兜底时设置这个 secret；平时留空，
          # npm 会走 GitHub OIDC（trusted publishing）。
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          {
            echo 'registry=https://registry.npmjs.org/'
            echo 'proxy='
            echo 'https-proxy='
            echo 'noproxy=*'
            if [ -n "${NODE_AUTH_TOKEN:-}" ]; then
              echo "//registry.npmjs.org/:_authToken=${NODE_AUTH_TOKEN}"
            fi
          } > "$NPM_CONFIG_USERCONFIG"
          # 自托管 runner 不支持 provenance（npm 会 422）；显式关掉，OIDC 认证照旧
          npm publish --access public --no-provenance
