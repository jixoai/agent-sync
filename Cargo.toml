[workspace]
members = ["crates/core", "crates/net", "crates/daemon", "crates/ui", "crates/cli"]
resolver = "3"

[workspace.package]
version = "0.2.2"
edition = "2024"
license = "MIT"

[workspace.dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
walkdir = "2"
sha2 = "0.10"
regex = "1"
toml = "0.9"
tempfile = "3"
log = "0.4"
